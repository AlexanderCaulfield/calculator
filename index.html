<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="phone">
        <div class="phone-screen">

            <div class="calculator-screen" id="screen"></div>

            <div class="button-container">
                
                <button class="action-btn clear-btn">C</button>
                <button class="action-btn flip-sign-btn">+/-</button>
                <button class="action-btn percent-btn">%</button>
                <button class="action-btn operator" value="/">/</button>
                <button class="digit-btn" value="7">7</button>
                <button class="digit-btn" value="8">8</button>
                <button class="digit-btn" value="9">9</button>
                <button class="action-btn operator" value="*">X</button>
                <button class="digit-btn" value="4">4</button>
                <button class="digit-btn" value="5">5</button>
                <button class="digit-btn" value="6">6</button>
                <button class="action-btn operator" value="-">-</button>
                <button class="digit-btn" value="1">1</button>
                <button class="digit-btn" value="2">2</button>
                <button class="digit-btn" value="3">3</button>
                <button class="action-btn operator" value="+">+</button>
                <button class="action-btn backspace-btn">
                    <img src="./images/backspace.png" alt="backspace Button">
                </button>
                <button class="digit-btn" value="0">0</button>
                <button class="action-btn float-btn" value=".">.</button>
                <button class="action-btn equal-btn">=</button>

            </div>

        </div>
    </div>
<script src="./script.js"></script>    
</body>
</html>
